<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap + JS Interactivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Mi Web</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ENCABEZADO -->
<header class="container text-center my-4">
  <h1>Página Interactiva con Bootstrap y JavaScript</h1>
</header>

<!-- CARRUSEL -->
<div id="carouselExample" class="carousel slide container mb-5">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <div class="carousel-box">Imagen 1</div>
    </div>
    <div class="carousel-item">
      <div class="carousel-box">Imagen 2</div>
    </div>
    <div class="carousel-item">
      <div class="carousel-box">Imagen 3</div>
    </div>
  </div>

  <button class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<!-- TABLA -->
<section class="container mb-5">
  <h2 class="mb-3">Productos</h2>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Laptop</td>
        <td>$1200</td>
        <td>10</td>
      </tr>
      <tr>
        <td>Celular</td>
        <td>$800</td>
        <td>15</td>
      </tr>
      <tr>
        <td>Audífonos</td>
        <td>$150</td>
        <td>20</td>
      </tr>
    </tbody>
  </table>
</section>

<!-- BOTÓN ALERTA -->
<div class="container mb-5 text-center">
  <button id="btnAlerta" class="btn btn-primary">
    Mostrar alerta
  </button>
</div>

<!-- FORMULARIO -->
<section class="container mb-5">
  <h2 class="mb-3">Contacto</h2>

  <form id="formulario">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" id="nombre" class="form-control">
      <small class="text-danger" id="errorNombre"></small>
    </div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input type="email" id="correo" class="form-control">
      <small class="text-danger" id="errorCorreo"></small>
    </div>

    <div class="mb-3">
      <label class="form-label">Mensaje</label>
      <textarea id="mensaje" class="form-control"></textarea>
      <small class="text-danger" id="errorMensaje"></small>
    </div>

    <button type="submit" class="btn btn-success">
      Enviar
    </button>
  </form>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
  <p>Contacto: ejemplo@email.com</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
